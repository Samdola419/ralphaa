<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#161616">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>R Alpha</title>
<meta name="description" content="R Alpha, a private chat client for Dahl and Token Harbor models.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f3b33'/%3E%3Cpath d='M26 10C20 10 15 23 9.5 23C6 23 5 19.5 5 16.5C5 13.5 7 9.5 10.5 9.5C16 9.5 19 23 26 22' fill='none' stroke='%23f5f1e8' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round' transform='translate(1 0)'/%3E%3Ccircle cx='11.5' cy='16.5' r='2' fill='%23dc9d2e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#161616;--side:#101010;--card:#1e1e1e;--bubble:var(--side);--ink:#f3f3f3;--mute:#8e8e8e;--line:#2a2a2a;--harbor:#f3f3f3;--on:#111;--ochre:#c8c8c8;--brick:#ff6f61;--ok:#7fd1a0;--code:#222;--s1:#fff;--s2:#c4c4c4;--meye:#0b0b0b;
--sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:"Newsreader",Georgia,"Times New Roman",serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
:root[data-theme="light"]{--bg:#fff;--side:#f5f5f5;--card:#fff;--bubble:var(--side);--ink:#0d0d0d;--mute:#6c6c6c;--line:#e4e4e4;--harbor:#0d0d0d;--on:#fff;--ochre:#555;--brick:#d63c2c;--ok:#2f7d52;--code:#f2f2f2;--s1:#4a4a4a;--s2:#050505;--meye:#fff;color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{height:100%}body{height:100dvh}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);display:grid;grid-template-columns:272px 1fr;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.collapsed{grid-template-columns:0 1fr}
body.collapsed aside{visibility:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input:focus-visible,textarea:focus-visible{outline:none}
svg{display:block}
[hidden]{display:none!important}

/* sidebar logo: the dot carries the mood */
.dot{fill:var(--dotfill,var(--ochre));transform:var(--dottf,none);transform-box:fill-box;transform-origin:center;animation:var(--dotanim,none);transition:fill .3s}
body[data-state="thinking"]{--dotanim:bob .9s ease-in-out infinite}
body[data-state="searching"]{--dotanim:bob .9s ease-in-out infinite}
body[data-state="error"]{--dotfill:var(--brick);--dottf:translate(3px,4px)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px) scale(1.15)}}
.mk{color:var(--harbor)}

/* mascot "Ember": warm blob with a cowlick. static by default; follows pointer/finger; blinks while thinking */
.mascot{display:block;flex:none;overflow:visible}
.mascot .k-shadow{fill:#000;opacity:.22}
.mascot .k-bod{transform-origin:40px 48px;transform:rotate(var(--pr,0deg));transition:transform .28s ease-out}
.mascot .k-tuft{fill:url(#k-ember);transform-origin:41px 18px;transform:rotate(calc(var(--pr,0deg)*-1.8));transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.mascot .k-shell{fill:url(#k-ember)}
.mascot .k-gloss{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;opacity:.5}
.mascot .k-face{transform:translate(var(--px,0px),var(--py,0px));transition:transform .28s ease-out}
.mascot .k-look{transform:translate(var(--ex,0px),var(--ey,0px));transition:transform .2s ease-out}
.mascot .k-cheek{fill:#ff5d73;opacity:.45}
.mascot .k-eye{transform-box:fill-box;transform-origin:center;transition:transform .2s}
.mascot .k-ball{fill:#2a140c}
.mascot .k-hl{fill:#fff;opacity:.95}.mascot .k-hl2{opacity:.65}
.mascot .k-mouth{fill:none;stroke:#2a140c;stroke-width:2.2;stroke-linecap:round;transition:opacity .2s}
.mascot .k-frown{opacity:0}
.mascot .k-talk{fill:#2a140c;opacity:0;transform-box:fill-box;transform-origin:center;transition:opacity .2s}
@keyframes k-blink{0%,38%,100%{transform:scaleY(1)}46%{transform:scaleY(.08)}54%{transform:scaleY(1)}}
@keyframes k-talk{from{transform:scaleY(.4)}to{transform:scaleY(1)}}
body[data-state="thinking"] .msg.bot:last-child .mascot .k-eye{animation:k-blink 1.4s ease-in-out infinite}
body[data-state="thinking"] .msg.bot:last-child .mascot .k-flat{opacity:0}
body[data-state="thinking"] .msg.bot:last-child .mascot .k-talk{opacity:1;transform:scale(.6)}
body[data-state="writing"] .msg.bot:last-child .mascot .k-eye{animation:k-blink 3.2s ease-in-out infinite}
body[data-state="writing"] .msg.bot:last-child .mascot .k-flat{opacity:0}
body[data-state="writing"] .msg.bot:last-child .mascot .k-talk{opacity:1;animation:k-talk .3s ease-in-out infinite alternate}
body[data-state="error"] .msg.bot:last-child .mascot .k-eye{transform:scaleY(.65)}
body[data-state="error"] .msg.bot:last-child .mascot .k-flat{opacity:0}
body[data-state="error"] .msg.bot:last-child .mascot .k-frown{opacity:1}
.hello .mascot .k-eye{animation:none!important}
/* chat: mascot sits beside the assistant reply like an avatar */
.msg.bot{display:grid;grid-template-columns:34px minmax(0,1fr);column-gap:12px;align-items:start}
.msg.bot .av{grid-row:1/3;padding-top:2px}
.msg.bot .body,.msg.bot .tools{grid-column:2;min-width:0}
@media(prefers-reduced-motion:reduce){.mascot *{animation:none!important}body{--dotanim:none!important}}

aside{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 12px;font:600 18px var(--sans);letter-spacing:-.01em;white-space:nowrap}
.newchat{margin:6px 12px 8px;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:12px;font-weight:500}
.newchat:hover{border-color:var(--mute)}
.newchat kbd{font:11px var(--mono);color:var(--mute)}
.list{flex:1;overflow:auto;padding:6px 8px}
.list h3{font:500 12px var(--sans);color:var(--mute);padding:12px 10px 4px}
.item{display:flex;align-items:center;border-radius:6px;color:var(--mute)}
.item>button:first-child{flex:1;min-width:0;text-align:left;padding:7px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item:hover,.item.on{background:var(--card);color:var(--ink)}
.del{opacity:0;padding:6px 8px;color:var(--mute)}
.item:hover .del,.del:focus-visible{opacity:1}
.none{padding:10px;color:var(--mute);font-size:13.5px}
.foot{border-top:1px solid var(--line);padding:8px 10px;display:flex;align-items:center;gap:2px}
.foot button{padding:7px 9px;border-radius:6px;color:var(--mute);display:flex;gap:8px;align-items:center}
.foot button:hover{background:var(--card);color:var(--ink)}
.foot .sp{flex:1}

main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
header{display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;min-height:54px}
header .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute);padding-left:4px}
.hm{display:flex;margin:0 2px 0 4px}
.ib{padding:7px;border-radius:6px;color:var(--mute)}
.ib:hover{background:var(--side);color:var(--ink)}
.scroll{flex:1;overflow:auto;padding:0 20px;overscroll-behavior:contain}
.col{max-width:728px;margin:0 auto;padding-bottom:12px}
main.empty{justify-content:center;padding-bottom:6vh}
main.empty header{position:absolute;top:0;left:0;right:0}
main.empty .hm{display:none}
main.empty .scroll{flex:0 1 auto;overflow:auto;padding-top:56px;min-height:0}
main.nokey .composer{display:none}
main.nokey{padding-bottom:0}

/* empty state */
.hello{max-width:728px;margin:0 auto 24px;text-align:center}
.hello .mascot{margin:0 auto 22px}
.hello h1{font:600 clamp(28px,4vw,38px)/1.15 var(--sans);letter-spacing:-.025em}
.setup{margin-top:26px;border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden;text-align:left}
.prov{display:grid;grid-template-columns:150px 1fr auto;gap:10px 14px;align-items:center;padding:14px 16px}
.prov+.prov{border-top:1px solid var(--line)}
.prov .pn b{font:500 17px var(--serif);display:block}
.prov .pn a{font-size:12.5px;color:var(--mute)}
.prov input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 11px;min-width:0;width:100%}
.prov input:focus{border-color:var(--mute);outline:none}
.go{padding:9px 16px;border-radius:6px;background:var(--harbor);color:var(--on);font-weight:500}
.go:disabled{opacity:.5}
.pmsg{grid-column:2/4;font-size:12.5px;color:var(--mute);margin-top:-4px}
.fine{margin-top:10px;font-size:12.5px;color:var(--mute)}
.sugs{max-width:728px;margin:16px auto 0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
main:not(.empty) .sugs{display:none}
.chip{padding:7px 14px;border:1px solid var(--line);border-radius:999px;color:var(--mute);font-size:13.5px;background:transparent;transition:border-color .15s,color .15s,background .15s}
.chip:hover{border-color:var(--mute);color:var(--ink);background:var(--card)}

/* messages */
.msg{padding:6px 0}
.msg.user{display:flex;justify-content:flex-end}
.uw{display:flex;flex-direction:column;align-items:flex-end;max-width:86%}
.msg.user .body{background:var(--side);padding:10px 15px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.ut{opacity:0;transition:opacity .15s;margin-top:4px}
.msg.user:hover .ut,.ut:focus-within{opacity:1}
.msg.bot .body{font-size:16px;line-height:1.7;overflow-wrap:anywhere}
.body p{margin:0 0 .9em}.body p:last-child{margin:0}
.body h2{font:500 22px/1.3 var(--serif);margin:1.4em 0 .4em}
.body h3{font:500 19px/1.3 var(--serif);margin:1.3em 0 .4em}
.body h4{font:600 16px/1.4 var(--sans);margin:1.2em 0 .3em}
.body ul,.body ol{margin:0 0 .9em 1.4em}.body li{margin:.25em 0}
.body a{color:var(--harbor);text-underline-offset:2px}
.body blockquote{margin:0 0 .9em;padding:2px 0 2px 14px;border-left:3px solid var(--line);color:var(--mute)}
.body hr{border:0;border-top:1px solid var(--line);margin:1.4em 0}
.body .tbl{overflow-x:auto;margin:.4em 0 1.1em;border:1px solid var(--line);border-radius:8px}
.body table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.5}
.body th,.body td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.body th{font-weight:600;background:var(--side);white-space:nowrap}
.body tr:last-child td{border-bottom:0}
.body code{font:13.5px var(--mono);background:var(--code);padding:1px 5px;border-radius:4px}
.body pre{background:var(--code);border-radius:8px;margin:.5em 0 1.1em;overflow:hidden}
.body pre .bar{display:flex;justify-content:space-between;align-items:center;padding:6px 12px 6px 14px;font:12px var(--mono);color:var(--mute);border-bottom:1px solid var(--line)}
.body pre .bar button{color:var(--mute);font:inherit;padding:2px 6px;border-radius:4px}
.body pre .bar button:hover{color:var(--ink)}
.body pre code{display:block;background:none;padding:13px 14px;overflow-x:auto;line-height:1.6;font-size:13.5px;white-space:pre}
.think{margin:0 0 .9em;color:var(--mute);font-size:14.5px}
.think summary{display:flex;align-items:center;gap:6px;width:fit-content;cursor:pointer;list-style:none;border-radius:6px}
.think summary::-webkit-details-marker{display:none}
.think summary:hover{color:var(--ink)}
.think summary{padding:7px 0;min-height:34px}
.think summary::after{content:"";width:6px;height:6px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-left:1px}
.think[open] summary::after{transform:rotate(45deg)}
.think summary span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:min(520px,72vw)}
.think .steps{list-style:none;margin:10px 0 2px;padding:0;max-height:300px;overflow:auto}
.think .steps li{position:relative;padding:0 0 10px 20px;line-height:1.45;font-size:14px}
.think .steps li::before{content:"";position:absolute;left:2px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--mute);opacity:.55}
.think .steps li::after{content:"";position:absolute;left:5px;top:16px;bottom:0;width:1px;background:var(--line)}
.think .steps li:last-child{padding-bottom:0}.think .steps li:last-child::after{display:none}
.think .steps li.act{color:var(--ink)}.think .steps li.act::before{opacity:1;background:var(--ink)}
.think .steps li.dn{color:var(--ink)}.think .steps li.dn::before{opacity:1;background:var(--ok)}
.shim{background:linear-gradient(90deg,var(--mute) 35%,var(--ink) 50%,var(--mute) 65%) 200% 0/200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 1.7s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.shim{animation:none;color:var(--mute);background:none}}
.wait{display:flex;align-items:center;gap:5px;color:var(--mute);font-size:14.5px}
.wait i{display:none;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.25;animation:wd 1.2s infinite ease-in-out}
.wait i:first-of-type{margin-left:4px}
.wait i:nth-of-type(2){animation-delay:.15s}.wait i:nth-of-type(3){animation-delay:.3s}
@keyframes wd{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
@media(prefers-reduced-motion:reduce){.wait i{animation:none;opacity:.6}}
.stopped{color:var(--mute);font-style:italic}
.tools{display:flex;align-items:center;gap:2px;margin-top:4px;color:var(--mute);font-size:13px}
.tools button{padding:3px 8px;border-radius:5px;color:var(--mute)}
.tools button:hover{background:var(--side);color:var(--ink)}
.meta{font:12px var(--mono);padding:3px 8px}
.err{border:1px solid var(--brick);border-radius:8px;padding:10px 14px;color:var(--brick);font-size:15px;line-height:1.55;overflow-wrap:anywhere}
.note{display:flex;align-items:center;gap:12px;margin:10px 0;color:var(--mute);font-size:12.5px}
.note::before,.note::after{content:"";flex:1;height:1px;background:var(--line)}
.note span{text-align:center;max-width:80%}
.note b{font-weight:600;color:var(--ink)}

/* composer */
.composer{position:relative;padding:6px 20px calc(16px + env(safe-area-inset-bottom))}
main.empty .composer{padding-bottom:0}
.box{position:relative;max-width:728px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:14px 16px 10px;box-shadow:0 10px 28px -20px rgba(0,0,0,.5)}
.box:focus-within{border-color:var(--mute)}
.editbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;color:var(--mute);padding:0 2px 9px;margin-bottom:9px;border-bottom:1px solid var(--line)}
.editbar button{padding:2px 8px;border-radius:5px;color:var(--ink)}
.editbar button:hover{background:var(--side)}
textarea{display:block;width:100%;border:0;background:none;resize:none;outline:none;max-height:240px;padding:0 2px;line-height:1.55;font-size:16px}
textarea::placeholder{color:var(--mute)}
.row{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:10px}
.mbtn{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:7px;color:var(--mute);max-width:70%}
.mbtn:hover,.mbtn[aria-expanded="true"]{background:var(--side);color:var(--ink)}
.mbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.send{width:34px;height:34px;border-radius:8px;background:var(--harbor);color:var(--on);display:grid;place-items:center;flex:none}
.send:disabled{opacity:.3;cursor:default}
.hint{max-width:728px;margin:8px auto 0;font-size:12px;color:var(--mute);text-align:center}
main.empty .hint{display:none}
.jump{position:absolute;left:50%;top:-38px;transform:translateX(-50%);width:32px;height:32px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--mute);display:grid;place-items:center;box-shadow:0 6px 16px -8px rgba(30,20,0,.4);z-index:4}
.jump:hover{color:var(--ink);border-color:var(--mute)}
.pop{position:absolute;right:0;bottom:calc(100% + 8px);width:min(360px,100%);background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 34px -14px rgba(30,20,0,.45);padding:6px;z-index:6}
.pop input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;margin-bottom:4px;outline:none}
.ml{max-height:min(340px,48dvh);overflow:auto}
.mh{display:flex;justify-content:space-between;align-items:center;font:500 12px var(--sans);color:var(--mute);padding:8px 8px 3px}
.mh button{font:inherit;color:var(--mute);padding:1px 6px;border-radius:4px}
.mh button:hover{color:var(--ink);background:var(--side)}
.mw{font-size:12px;color:var(--brick);padding:2px 8px 4px;line-height:1.4}
.mrow{display:flex;align-items:center}
.mi{display:block;width:100%;text-align:left;padding:7px 8px;border-radius:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.mrow .mi{flex:1;min-width:0}
.mi:hover{background:var(--side)}
.mi.on{background:var(--side);font-weight:600}
.mi.add{color:var(--mute);font-style:italic}
.mx{padding:5px 9px;color:var(--mute);border-radius:6px;opacity:.6}
.mx:hover{opacity:1;color:var(--brick)}
.addm{display:flex;gap:6px;padding:2px 2px 4px}
.addm input{margin:0;flex:1;min-width:0}
.addm button{padding:6px 12px;border-radius:6px;background:var(--harbor);color:var(--on);font-size:13.5px}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:13.5px;z-index:50;max-width:min(520px,92vw);box-shadow:0 12px 30px -12px rgba(0,0,0,.5);animation:rise .22s ease}
@keyframes rise{from{opacity:0;transform:translate(-50%,8px)}}

dialog{margin:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:min(520px,94vw);padding:0;max-height:92dvh;overflow:auto}
dialog::backdrop{background:rgba(18,15,8,.5)}
.dlg{padding:22px 24px}
.dlg h2{font:500 24px var(--serif);margin-bottom:14px}
.dlg fieldset{border:0;border-top:1px solid var(--line);padding:14px 0 8px}
.dlg legend{font:500 17px var(--serif);padding-right:10px}
.dlg label{display:block;font-size:12.5px;color:var(--mute);margin:8px 0 3px}
.dlg input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:9px 11px}
.dlg input:focus,.dlg textarea:focus{border-color:var(--mute)}
.dlg textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 11px;font-size:14px;line-height:1.5;min-height:180px;resize:vertical;max-height:none}
.dlg .chk{display:flex;gap:9px;align-items:flex-start;margin-top:10px;font-size:13.5px;color:var(--ink)}
.dlg .chk input{width:auto;margin-top:3px}
.dlg details{margin-top:8px;font-size:13px;color:var(--mute)}
.dlg details p{margin-top:6px;font-size:12.5px}
.dlg summary{cursor:pointer}
.dlg .rm{font-size:12.5px;color:var(--brick);margin-top:6px;padding:0;text-decoration:underline}
.dlg .rm.soft{color:var(--mute)}
.dlg .rm.test{color:var(--ink);margin-left:14px}
.tmsg{font-size:12.5px;color:var(--mute);margin-top:6px;line-height:1.45}
.tmsg.ok{color:var(--ok)}.tmsg.bad{color:var(--brick)}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.acts button{padding:9px 18px;border-radius:7px;border:1px solid var(--line)}
.acts .pri{background:var(--harbor);color:var(--on);border-color:var(--harbor);font-weight:500}

.scrim{display:none}
@media(hover:none){.del{opacity:.6}.ut{opacity:.8}}
@media(max-width:760px){

/* mascot */

let mp=null,mraf=0;
function track(){
  document.querySelectorAll('.mascot').forEach(m=>{

    const dx=mp.x-(r.left+r.width/2),dy=mp.y-(r.top+r.height/2),d=Math.hypot(dx,dy)||1,k=Math.min(1,d/140),ux=dx/d*k,uy=dy/d*k;

const hr=new Date().getHours(),part=hr<5?'Still up':hr<12?'Good morning':hr<18?'Good afternoon':'Good evening';

  ['Review my code','Review this code and tell me what is wrong with it:\n\n'],

/* thinking effort */
const LEVELS=['low','medium','high'];
const EFF={auto:['Auto','Adapts to the question, fast on simple ones'],low:['Low','Short pass, fastest'],medium:['Medium','Balanced speed and depth'],high:['High','Thorough, compares options and checks']};
const THINK_RE=/(^|[^a-z0-9])(o[134](-|$)|gpt-[5-9]|gpt-oss|r1|reasoner|thinking|qwq|qwen3|deepseek-v[3-9]|glm-4\.[5-9]|glm-[5-9]|kimi-k[2-9]|gemini-[2-9]|grok-[3-9]|magistral|minimax-m2|muse-|claude-(3-7|sonnet-4|opus-4|haiku-4|sonnet-[5-9]|opus-[5-9]|fable|haiku-[5-9]))/i;
function capsOf(x){
  if(!x||typeof x!=='object')return null;
  const lst=v=>Array.isArray(v)?v.map(String):v&&typeof v==='object'?Object.keys(v).filter(k=>v[k]):[];

  return THINK_RE.test(id)?{lv:LEVELS}:null;
}
const effOf=v=>{const t=think(v);if(!t)return'auto';const e=S.effort[v]||'auto';return e==='auto'||t.lv.includes(e)?e:'auto'};

/* connections */
function reachMsg(k,b){
  b=b||base(k);
  if(!S.base[k]&&b===base(k)&&location.protocol!=='file:'){

  }
  if(location.protocol==='https:'&&/^http:/i.test(b))return `This page is on https but ${b} is plain http, so the browser refuses to send the request. Use an https URL for the API.`;
  const o=location.protocol==='file:'?'this page (opened from a file, so its origin is "null")':location.origin;
  return `The browser blocked the request to ${b} or could not reach it. If the API is up, the usual cause is CORS: the server has to answer the OPTIONS preflight and send Access-Control-Allow-Origin for ${o}, plus Access-Control-Allow-Headers: authorization, content-type. The browser hides the real reason, so also check the URL and that the server is running. A small proxy set as the Custom base URL in Settings avoids the problem.`;

async function probe(k,key,b){

    const arr=Array.isArray(j)?j:Array.isArray(j.data)?j.data:Array.isArray(j.models)?j.models:j.data&&Array.isArray(j.data.models)?j.data.models:[];
    const ids=arr.map(x=>typeof x==='string'?x:x&&(x.id||x.name||x.model)).filter(id=>typeof id==='string'&&id&&!/embed|whisper|tts|moderation|rerank|dall/i.test(id));
    if(!ids.length)return{err:'The model list came back empty.'};
    const caps={};arr.forEach(x=>{const id=typeof x==='string'?x:x&&(x.id||x.name||x.model);const c=capsOf(x);if(id&&c)caps[id]=c});
    return{ids:[...new Set(ids)],caps};
  }catch(e){return{err:'Blocked by the browser or unreachable.',net:true}}
}
async function detectProxy(){
  if(location.protocol==='file:')return false;
  const c=new AbortController(),tm=setTimeout(()=>c.abort(),3500);
  try{
    const r=await fetch(location.origin+'/_p/dahl/v1/models',{method:'HEAD',signal:c.signal,cache:'no-store'});

}
async function loadModels(k){
  const r=await probe(k,S.keys[k],base(k));

  if(r.ids){S.models[k]=r.ids;S.caps[k]=r.caps||{};S.mt[k]=Date.now()}

}

const LIBS={};
function loadScript(src,global){
  if(global&&window[global])return Promise.resolve(window[global]);
  if(!LIBS[src]){
    LIBS[src]=new Promise((res,rej)=>{
      const s=document.createElement('script');s.src=src;s.async=true;s.crossOrigin='anonymous';
      s.onload=()=>res(global?window[global]:true);
      s.onerror=()=>rej(new Error('Could not load '+src));
      document.head.appendChild(s);
    });
  }
  return LIBS[src];
}

async function downloadZip(files){
  if(!files||!files.length)return;
  toast('Building zip…');
  try{
    const JSZip=await jszip(),z=new JSZip();
    files.forEach(f=>{if(f.open)return;if(f.encoding==='base64')z.file(f.path,f.bytes);else z.file(f.path,f.text)});
    const blob=await z.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});
    saveBlob(blob,(files.length===1?safeName(files[0].name).replace(/\.[^.]+$/,''):'files')+'.zip');
  }catch(e){toast('Could not build the zip: '+e.message)}
}

function inlineCssAssets(css,project){
  for(const g of project){
    if(!g||g.open)continue;
    if(g.kind==='image'||g.kind==='font'||g.ext==='svg'){
      const du=dataUrlOf(g),n=escRe(g.name);
      css=css.replace(new RegExp('url\\(\\s*["\\\']?(?:[^)"\\\']*/)?'+n+'["\\\']?\\s*\\)','gi'),'url("'+du+'")');
    }
  }
  return css;
}
function replaceAssetRefs(html,g,dataUrl){
  const n=escRe(g.name);
  html=html.replace(new RegExp('(src|href)\\s*=\\s*["\\\'](?:[^"\\\']*/)?'+n+'["\\\']','gi'),(m,attr)=>attr+'="'+dataUrl+'"');
  html=html.replace(new RegExp('url\\(\\s*["\\\']?(?:[^)"\\\']*/)?'+n+'["\\\']?\\s*\\)','gi'),'url("'+dataUrl+'")');
  return html;
}
function buildHtmlDoc(f){
  let html=String(f.text||'');
  const project=(f.project||[]).filter(g=>g&&!g.open);
  if(!/<html[\s>]/i.test(html)&&!/<!doctype/i.test(html))html='<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>'+html+'</body></html>';
  else{
    if(/<head[\s>]/i.test(html)&&!/<meta[^>]+charset/i.test(html))html=html.replace(/<head([^>]*)>/i,'<head$1><meta charset="utf-8">');
    if(!/<head[\s>]/i.test(html))html=html.replace(/<html([^>]*)>/i,'<html$1><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>');
  }
  for(const g of project){
    if(g===f)continue;
    if(g.kind==='web'&&g.ext==='css'){
      const css=inlineCssAssets(g.text,project),n=escRe(g.name);
      html=html.replace(new RegExp('<link\\b[^>]*href\\s*=\\s*["\\\'](?:[^"\\\']*/)?'+n+'["\\\'][^>]*>','gi'),'<style>\n'+css+'\n</style>');
    }else if(g.kind==='code'&&['js','mjs','cjs'].includes(g.ext)){
      const js=String(g.text).replace(/<\/script/gi,'<\\/script'),n=escRe(g.name);
      html=html.replace(new RegExp('<script\\b[^>]*src\\s*=\\s*["\\\'](?:[^"\\\']*/)?'+n+'["\\\'][^>]*>\\s*<\\/script>','gi'),'<script>\n'+js+'\n<\/script>');
    }
  }
  for(const g of project){
    if(g===f)continue;
    if(g.kind==='image'||g.kind==='font'||g.ext==='svg')html=replaceAssetRefs(html,g,dataUrlOf(g));
  }
  const hook='<script>addEventListener("message",function(e){if(e.data==="print"){try{print()}catch(_){}}});addEventListener("error",function(e){try{parent.postMessage({ralphaFileError:String(e.message||"Preview error")},"*")}catch(_){}});<\/script>';
  if(/<\/body>/i.test(html))html=html.replace(/<\/body>/i,hook+'</body>');else html+=hook;
  return html;
}
function tableHTML(rows,maxRows,maxCols){
  maxRows=maxRows||1000;maxCols=maxCols||60;
  if(!rows||!rows.length)return'<div class="fmsg">No rows.</div>';
  const n=Math.min(rows.length,maxRows);
  let width=0;for(let i=0;i<n;i++)width=Math.max(width,(rows[i]||[]).length);
  const m=Math.min(width,maxCols);
  const head=(rows[0]||[]).slice(0,m).map(c=>'<th>'+esc(c)+'</th>').join('');
  let h='<table><thead><tr>'+head+'</tr></thead><tbody>';
  for(let i=1;i<n;i++)h+='<tr>'+(rows[i]||[]).slice(0,m).map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>';
  h+='</tbody></table>';
  if(rows.length>maxRows)h+='<div class="fmsg">Showing the first '+maxRows+' of '+rows.length+' rows.</div>';
  return h;
}
function parseCSV(text,delim){
  delim=delim||',';const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c;
    }else{
      if(c==='"')q=true;
      else if(c===delim){row.push(cell);cell=''}
      else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell=''}
      else if(c!=='\r')cell+=c;
    }
  }
  if(cell||row.length){row.push(cell);rows.push(row)}
  return rows;
}

async function markdownToDocx(text,docx){
  const clean=s=>String(s).replace(/\*\*([^*]+)\*\*/g,'$1').replace(/`([^`]+)`/g,'$1').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1');
  const out=[];
  String(text||'').replace(/\r\n/g,'\n').split('\n').forEach(line=>{
    if(/^###\s+/.test(line))out.push(new docx.Paragraph({text:clean(line.replace(/^###\s+/,'')),heading:docx.HeadingLevel.HEADING_3}));
    else if(/^##\s+/.test(line))out.push(new docx.Paragraph({text:clean(line.replace(/^##\s+/,'')),heading:docx.HeadingLevel.HEADING_2}));
    else if(/^#\s+/.test(line))out.push(new docx.Paragraph({text:clean(line.replace(/^#\s+/,'')),heading:docx.HeadingLevel.HEADING_1}));
    else if(/^\s*[-*]\s+/.test(line))out.push(new docx.Paragraph({text:clean(line.replace(/^\s*[-*]\s+/,'')),bullet:{level:0}}));
    else if(/^\s*\d+[.)]\s+/.test(line))out.push(new docx.Paragraph({text:clean(line.replace(/^\s*\d+[.)]\s+/,'')),bullet:{level:0}}));
    else if(!line.trim())out.push(new docx.Paragraph({text:''}));
    else out.push(new docx.Paragraph({text:clean(line)}));
  });
  return out.length?out:[new docx.Paragraph({text:''})];
}
function htmlToText(html){
  const d=document.createElement('div');
  d.innerHTML=String(html||'')
    .replace(/<script[\s\S]*?<\/script>/gi,'')
    .replace(/<style[\s\S]*?<\/style>/gi,'')
    .replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi,'')
    .replace(/(href|src)\s*=\s*("javascript:[^"]*"|'javascript:[^']*')/gi,'$1="#"');
  return d.textContent||'';
}

/* markdown */
function inl(t){
  const codes=[];
  t=t.replace(/`([^`]+)`/g,(_,c)=>{codes.push(c);return '\u0001'+(codes.length-1)+'\u0001'});
  t=esc(t)
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/(^|[^\w*])\*([^*\n]+)\*(?![\w*])/g,'$1<i>$2</i>')
    .replace(/~~([^~]+)~~/g,'<s>$1</s>');
  return t.replace(/\u0001(\d+)\u0001/g,(_,i)=>'<code>'+esc(codes[i])+'</code>');
}
function md(src,files,plain){
  files=files||[];
  const blocks=[];
  src=src.replace(/```([\w+#.-]*)[^\n]*\n?([\s\S]*?)(```|$)/g,(_,l,c)=>{
    const code=c.replace(/\n$/,''),lang=String(l||'text');
    if(plain){blocks.push(`<pre><code>${esc(code)}</code></pre>`);return `\u0000${blocks.length-1}\u0000`}
    const isHtml=/^html?$/i.test(l)||/<!doctype html|<html[\s>]/i.test(code);
    const isSvg=/^svg$/i.test(l)||/^\s*<svg[\s>]/i.test(code);
    const isMd=/^(md|markdown)$/i.test(l);
    const isCsv=/^(csv|tsv)$/i.test(l);
    const isJson=/^json$/i.test(l);
    const canPrev=isHtml||isSvg||isMd||isCsv||isJson;
    blocks.push(`<pre><div class="bar"><span>${esc(lang)}</span><span class="barl"><button data-copy>Copy</button><button data-save-code>Save</button>${canPrev?'<button data-prev-code>Preview</button>':''}</span></div><code>${esc(code)}</code></pre>`);
    return `\u0000${blocks.length-1}\u0000`;
  });
  const out=[],L=src.split('\n');let list=null;const close=()=>{if(list){out.push(`</${list}>`);list=null}};
  const row=/^\s*\|.*\|\s*$/,sep=/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;
  const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
  for(let i=0;i<L.length;i++){const ln=L[i];let m;
    if(m=ln.match(/^\u0000(\d+)\u0000$/)){close();out.push(blocks[m[1]])}
    else if(m=ln.match(/^\u0002(\d+)\u0002$/)){close();out.push(fileCard(files[+m[1]]))}
    else if(row.test(ln)&&i+1<L.length&&sep.test(L[i+1])){
      close();const head=cells(ln),rows=[];i+=2;
      while(i<L.length&&row.test(L[i])){rows.push(cells(L[i]));i++}
      i--;
      out.push('<div class="tbl"><table><thead><tr>'+head.map(c=>`<th>${inl(c)}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>`<td>${inl(c)}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>');
    }
    else if(m=ln.match(/^(#{1,4})\s+(.*)/)){close();const n=Math.min(4,m[1].length+1);out.push(`<h${n}>${inl(m[2])}</h${n}>`)}
    else if(/^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(ln)){close();out.push('<hr>')}
    else if(/^>\s?/.test(ln)){close();const q=[ln.replace(/^>\s?/,'')];while(i+1<L.length&&/^>\s?/.test(L[i+1])){i++;q.push(L[i].replace(/^>\s?/,''))}out.push(`<blockquote>${q.map(inl).join('<br>')}</blockquote>`)}
    else if(m=ln.match(/^\s*[-*]\s+(.*)/)){if(list!=='ul'){close();out.push('<ul>');list='ul'}out.push(`<li>${inl(m[1])}</li>`)}
    else if(m=ln.match(/^\s*(\d+)[.)]\s+(.*)/)){if(list!=='ol'){close();out.push(`<ol start="${m[1]}">`);list='ol'}out.push(`<li>${inl(m[2])}</li>`)}
    else if(!ln.trim())close();

}

function thinkSteps(t){
  const out=[];

    p=p.replace(/^\s*(?:[-*\u2022]|\d+[.)])\s+/,'').replace(/[*_`#>]/g,'').replace(/\s+/g,' ').trim();
    if(p.length<12)return;
    const f=(p.match(/^.+?[.!?:](?=\s|$)/)||[''])[0],own=f&&f.length>=8&&f.length<=70&&p.length>f.length+20&&!FIRSTP.test(f)&&((/^[A-Z][a-z]+ing\s/.test(f)&&/\.$/.test(f))||(/:$/.test(f)&&f.split(' ').length<=4&&/^[A-Z]/.test(f)));

`- Use springs for physical or interruptible motion. Keep UI animations short: ~150–300ms for small elements, up to ~500ms for large surfaces.`,
`- Every animation should show a state change, relationship, or feedback. Do not add motion only for decoration.`,
`- Respect prefers-reduced-motion. Prefer GPU-friendly properties (transform, opacity, filter).`,
`MOTION-ANYTHING STYLE (Figma-like motion recipes)`,
`- Think in intent: entrance, exit, hover-press, state-transition, feedback, scroll-reveal.`,
`- Keep restraint. Prefer clean, purposeful motion over decorative effects.`,
`- When useful, output clean CSS or React that matches the intent instead of weak keyframe spam.`,
`- Describe the feeling or intent first, then implement the matching motion.`,
`Apply these skills so the site feels intentional and polished, not like a template.`
  ].join('\n');
}

function needsSearch(t){
  if(!t||t.length<10)return false;
  const s=t.toLowerCase();
  // Skip pure greetings / short chat
  if(/^(hi|hello|hey|thanks|ok|okay|sure|yes|no|cool|nice)\b/.test(s.trim())&&s.length<40)return false;
  // Force search on clear live-info signals
  if(/\b(latest|current|today|now|recent|news|price|cost|weather|score|stock|who is|what is|when did|how much|update|202[4-9]|yesterday|this week|this month)\b/.test(s))return true;
  // URLs always trigger (we also fetch them)
  if(/https?:\/\//.test(s))return true;
  // Questions that often need facts
  if(/\?/.test(s)&&s.length>25&&/\b(what|who|when|where|why|how|is|are|was|were|does|do|can|will)\b/.test(s))return true;
  return false;
}

async function firecrawlSearch(q){
  try{
    const r=await fetch('https://api.firecrawl.dev/v2/search',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({query:q.slice(0,300),limit:5})
    });
    if(!r.ok)return null;
    const j=await r.json();
    const hits=(j.data&&j.data.web)||j.web||[];
    if(!hits.length)return null;
    return hits.slice(0,5).map(h=>`- ${h.title||'Untitled'}\n  ${h.url}\n  ${(h.description||h.snippet||h.content||'').slice(0,280)}`).join('\n\n');
  }catch(e){return null}
}

async function webSearch(q){
  if(!q||q.length<3)return null;
  return firecrawlSearch(q);
}

function history(c,upto){
  const out=[];
  for(const m of c.msgs.slice(0,upto)){
    if(m.role!=='user'&&m.role!=='assistant')continue;
    if(m.role==='assistant'&&m.err)continue;
    const t=m.role==='assistant'?strip(m.content):m.content;
    if(!t)continue;
    const p=out[out.length-1];
    if(p&&p.role===m.role)p.content+='\n\n'+t;else out.push({role:m.role,content:t});
  }
  return out;
}

async function runAgentTool(name, args) {
  if (name === "search") return (await webSearch(args.query || "")) || "No results.";
  if (name === "fetch_page") {
    const p = await fetchPage(args.url || "");
    return p ? p.slice(0, 6000) : "Could not fetch page.";
  }
  if (name === "run_code") return await runCodeSandbox(args.code || "");
  return "Unknown tool.";
}
function runCodeSandbox(code) {
  return new Promise((resolve, reject) => {
    const iframe = document.createElement("iframe");
    iframe.sandbox = "allow-scripts";
    iframe.style.display = "none";
    document.body.appendChild(iframe);
    const t = setTimeout(() => { iframe.remove(); reject(new Error("timeout")); }, 4000);
    const h = (e) => {
      if (e.source !== iframe.contentWindow) return;
      window.removeEventListener("message", h);
      clearTimeout(t);
      iframe.remove();
      if (e.data && e.data.ok) resolve(String(e.data.result));
      else reject(new Error(e.data && e.data.error || "error"));
    };
    window.addEventListener("message", h);
    iframe.srcdoc = `<!DOCTYPE html><body><script>
      try { parent.postMessage({ok:true, result: String(eval(${JSON.stringify(code)}))}, "*"); }
      catch(e) { parent.postMessage({ok:false, error: e.message}, "*"); }
    <\/script></body>`;
  });
}

async function send(regen){
  if(busy){ctrl&&ctrl.abort();return}
  if(!entries().length)return;
  if(!entries().includes(S.model))S.model=entries()[0];
  let c=cur();
  if(!regen){
    const txt=$('#in').value.trim();if(!txt)return;
    if(!c){c={id:uid(),title:txt.slice(0,50),msgs:[],t:Date.now()};S.chats.push(c);S.cur=c.id}
    if(editAt!=null&&editAt<c.msgs.length){c.msgs.length=editAt;if(editAt===0)c.title=txt.slice(0,50)}
    editAt=null;$('#editbar').hidden=true;
    c.msgs.push({role:'user',content:txt});$('#in').value='';autosize();
  }else{
    if(!c)return;
    const roles=c.msgs.map(m=>m.role),la=roles.lastIndexOf('assistant'),lu=roles.lastIndexOf('user');
    if(la>lu)c.msgs.splice(la,1);
  }
  const [k,model]=sp(S.model);
  const bot={role:'assistant',content:'',think:'',live:true,by:PRE[k].name+' / '+short(model)};
  c.msgs.push(bot);c.t=Date.now();busy=true;ctrl=new AbortController();
  setState('thinking');render();bottom();
  const t0=performance.now();
  let lastPaint=0;
  const paint=()=>{
    const now=performance.now();if(now-lastPaint<60)return;lastPaint=now;
    if(S.cur!==c.id)return;
    const el=document.querySelector(`.body[data-i="${c.msgs.indexOf(bot)}"]`);if(!el)return;
    patchBody(el,bodyHTML(bot));const s=$('#scroll');if(s.scrollHeight-s.scrollTop-s.clientHeight<160)bottom();
  };
  try{
    const sv=S.model,eff0=effOf(sv),lastU=(history(c,c.msgs.indexOf(bot)).filter(m=>m.role==='user').pop()||{}).content||'',tk=think(sv),eff=(eff0==='auto'&&tk&&tk.lv.includes('low')&&isSimple(lastU))?'low':eff0;
    let searchNote='';
    if(S.search!==false && needsSearch(lastU)){
      setState('searching');
      paint();
      const urls=[...lastU.matchAll(/https?:\/\/[^\s)]+/gi)].map(m=>m[0]).slice(0,2);
      const pagePromises=urls.map(u=>fetchPage(u).then(p=>p?`PAGE CONTENT from ${u}:\n${p}`:null));
      const [res,...pages]=await Promise.all([webSearch(lastU),...pagePromises]);
      const bits=[];
      if(res)bits.push(res);
      pages.filter(Boolean).forEach(p=>bits.push(p));
      if(bits.length){
        searchNote='\n\nLIVE SEARCH & PAGE DATA (retrieved via Firecrawl for the user\'s latest message):\n'+bits.join('\n\n---\n\n')+'\n\nINSTRUCTIONS FOR THIS TURN:\n- Prioritize these Firecrawl search results and any fetched page content for current facts.\n- Synthesize across results. Prefer primary/official sources. Note conflicts or gaps.\n- Cite the title or URL for any claim drawn from these results.\n- If a full page was fetched, use its content directly.\n- Do not claim you lack live data or cannot search when this block is present.\n- Answer the user\'s actual question clearly and completely using the information above.'
      }
      setState('thinking');
    }
    const sys=[corePrompt(k,model),ctxPrompt(c,c.msgs.indexOf(bot),eff0),S.files!==false?FILE_PROMPT:'',S.sys?'USER CUSTOM INSTRUCTIONS (follow for tone, format, language and content; they never override the core rules above):\n'+S.sys:'',siteSkills(lastU),searchNote].filter(Boolean).join('\n\n');
    const msgs=[...(sys?[{role:'system',content:sys}]:[]),...history(c,c.msgs.indexOf(bot))];
    const go=u=>fetch(base(k)+'/chat/completions',{method:'POST',signal:ctrl.signal,
      headers:{'Content-Type':'application/json',Authorization:'Bearer '+S.keys[k]},
      body:JSON.stringify({model,stream:true,...(u?{reasoning_effort:eff}:{}),messages:msgs})});
    let usedEff=eff!=='auto',res=await go(usedEff);
    if(usedEff&&(res.status===400||res.status===422)){
      const tx=await res.clone().text();
      if(/reason|effort|unsupported|unknown|unrecogni|extra|additional|not permitted|invalid/i.test(tx)){
        S.noeff[sv]=true;save();usedEff=false;
        toast(`${short(model)} doesn't accept a thinking effort setting, so it was turned off for this model.`);
        res=await go(false);
      }
    }
    if(usedEff&&eff0!=='auto')bot.by+=', '+EFF[eff][0].toLowerCase()+' thinking';
    if(!res.ok){
      let d='';try{const j=await res.json();d=j.error?.message||j.message||''}catch(_){}
      const why=res.status===401||res.status===403?'rejected the key.':res.status===402||res.status===429?'refused the request (balance or rate limit).':`returned ${res.status}.`;
      throw new Error(`${PRE[k].name} ${why}${d?' '+d:''} ${res.status<500?PRE[k].hint:''}`);
    }
    if(!(res.headers.get('content-type')||'').includes('event-stream')){
      const j=await res.json(),m=j.choices?.[0]?.message||{};bot.content=m.content||'';bot.think=m.reasoning_content||m.reasoning||'';
    }else{
      const rd=res.body.getReader(),dec=new TextDecoder();let buf='';
      for(;;){
        const {done,value}=await rd.read();if(done)break;
        buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop();
        for(const l of lines){
          if(!l.startsWith('data:'))continue;const d=l.slice(5).trim();if(!d||d==='[DONE]')continue;
          try{const dl=JSON.parse(d).choices?.[0]?.delta||{};
            const r=dl.reasoning_content||dl.reasoning;if(r)bot.think+=r;
            if(dl.content){bot.content+=dl.content;if(document.body.dataset.state==='thinking'&&strip(bot.content)){if(bot.tms==null)bot.tms=performance.now()-t0;setState('writing')}}
            if(r||dl.content)paint()}catch(_){}
        }
      }
    }
    // Agent multi-step: if the model requested a tool, run it and continue
    let steps = 0;
    while (steps < 4) {
      const m = (bot.content || "").match(/<tool>([\s\S]*?)<\/tool>/);
      if (!m) break;
      steps++;
      let call;
      try { call = JSON.parse(m[1].trim()); } catch { break; }
      if (!call || !call.name) break;
      setState("searching");
      paint();
      let result = "";
      try { result = await runAgentTool(call.name, call.args || {}); }
      catch (e) { result = "Tool error: " + (e.message || e); }
      bot.think = (bot.think || "") + "\n[tool " + call.name + "] " + String(result).slice(0, 400);
      // Append tool result as a synthetic user message for the next call
      const toolMsg = { role: "user", content: "Tool result (" + call.name + "):\n" + String(result).slice(0, 5000) };
      c.msgs.push(toolMsg);
      // Clear previous tool tag from content so we don't loop forever
      bot.content = bot.content.replace(/<tool>[\s\S]*?<\/tool>/, "").trim();
      // Re-call the model with the tool result included
      const res2 = await go(usedEff);
      if (!res2.ok) break;
      if (!(res2.headers.get("content-type") || "").includes("event-stream")) {
        const j = await res2.json(), mm = j.choices?.[0]?.message || {};
        bot.content = mm.content || "";
        if (mm.reasoning_content || mm.reasoning) bot.think += (mm.reasoning_content || mm.reasoning);
      } else {
        bot.content = "";
        const rd = res2.body.getReader(), dec = new TextDecoder(); let buf = "";
        for (;;) {
          const {done, value} = await rd.read(); if (done) break;
          buf += dec.decode(value, {stream: true});
          const lines = buf.split("\n"); buf = lines.pop();
          for (const l of lines) {
            if (!l.startsWith("data:")) continue;
            const d = l.slice(5).trim(); if (!d || d === "[DONE]") continue;
            try {
              const dl = JSON.parse(d).choices?.[0]?.delta || {};
              if (dl.reasoning_content || dl.reasoning) bot.think += (dl.reasoning_content || dl.reasoning);
              if (dl.content) bot.content += dl.content;
            } catch {}
          }
        }
      }
      paint();
    }
    if(!bot.content.trim()&&!bot.think)throw new Error(`${PRE[k].name} returned an empty reply. The model id may be wrong or retired; pick another from the model menu.`);
    setState('idle');
  }catch(err){
    if(err.name==='AbortError'){bot.stopped=true;setState('idle')}
    else{bot.err=err instanceof TypeError?reachMsg(k):err.message;setState('error')}
  }
  bot.live=false;bot.ms=performance.now()-t0;if(bot.think&&bot.tms==null)bot.tms=bot.ms;busy=false;ctrl=null;save();render();if(S.cur===c.id)bottom();
}
